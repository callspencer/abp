<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120c07">
<title>Medellín: ¿quién cuenta esta historia?</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#120c07;color:#f4e8cb;font-family:Georgia,serif}
body{display:grid;place-items:center;min-height:100vh;padding:24px}
main{width:min(100%,960px);text-align:center}
h1{font-size:clamp(2rem,7vw,5.5rem);line-height:1.16;padding:.2em .12em .3em;overflow:visible;text-wrap:balance;color:#f4e8cb;text-shadow:4px 5px 0 #5d3925}
p{margin:24px auto;max-width:680px;font:clamp(1rem,2.4vw,1.35rem)/1.6 sans-serif;color:#e5cfad}
#status{font:1rem/1.5 sans-serif;color:#e5cfad}
#start{display:none;margin:24px auto 0;padding:14px 22px;border:0;background:#f4e8cb;color:#2b1a0d;font-size:1.1rem;font-weight:bold;cursor:pointer}
#start:disabled{opacity:.6;cursor:wait}
#progress{width:min(100%,420px);height:8px;margin:16px auto;background:#39291d;border-radius:8px;overflow:hidden}
#bar{height:100%;width:0;background:#e9b86a;transition:width .2s}
#errors{display:none;margin-top:12px;color:#ffd2a8;font: .9rem/1.5 sans-serif}
</style>
</head>
<body>
<main>
<h1>Medellín: ¿quién cuenta esta historia?</h1>
<p>Una historia de memoria, violencia y de las personas que siguen construyendo ciudad.</p>
<div id="status" role="status" aria-live="polite">Preparando la experiencia…</div>
<div id="progress" aria-hidden="true"><div id="bar"></div></div>
<button id="start" type="button">Empezar</button>
<div id="errors"></div>
</main>
<script>
'use strict';
const files=['assets1.zip','assets2.zip','assets3.zip'];
const status=document.querySelector('#status');
const bar=document.querySelector('#bar');
const start=document.querySelector('#start');
const errors=document.querySelector('#errors');

// Keep the start screen in place until the complete asset bundles have arrived.
// Fetching them in parallel reduces the wait while still reporting progress.
async function preload(){
  let done=0;
  const results=await Promise.all(files.map(async file=>{
    try{
      const response=await fetch(file);
      if(!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
      const blob=await response.blob();
      done++;
      bar.style.width=`${Math.round(done/files.length*100)}%`;
      status.textContent=`Recursos cargados: ${done} de ${files.length}…`;
      return {file,ok:true,blob};
    }catch(error){
      done++;
      bar.style.width=`${Math.round(done/files.length*100)}%`;
      return {file,ok:false,error};
    }
  }));
  const failed=results.filter(item=>!item.ok);
  if(failed.length){
    errors.style.display='block';
    errors.textContent='No se pudieron cargar algunos archivos. Comprueba que assets1.zip, assets2.zip y assets3.zip estén publicados junto a index.html y vuelve a cargar la página.';
    status.textContent='No se pudieron cargar todos los recursos.';
    start.textContent='Reintentar';
    start.style.display='inline-block';
    start.disabled=false;
    start.onclick=()=>location.reload();
    return;
  }
  // Retain downloaded bundles in the browser cache for the subsequent experience.
  status.textContent='Todos los recursos están cargados. Ya puedes empezar.';
  start.style.display='inline-block';
  start.disabled=false;
  start.onclick=()=>{
    status.textContent='¡Listo!';
    start.disabled=true;
  };
}
start.disabled=true;
preload();
</script>
</body>
</html>
